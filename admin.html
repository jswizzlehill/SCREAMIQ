<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreamIQ Admin</title>
<style>
body{margin:0;background:#060203;color:#f3dede;font-family:Georgia,serif;padding:16px}
main{max-width:560px;margin:0 auto}
h1{color:#e3182f;margin:8px 0 16px}
.card{background:#140609;border:1px solid #5a141c;border-radius:12px;padding:14px;margin-bottom:12px}
input{font:inherit;padding:10px;border-radius:8px;border:2px solid #6e1a24;background:#0a0305;color:#f3dede;width:100%;margin-bottom:8px;box-sizing:border-box}
button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:#e3182f;color:#fff;font-weight:bold;cursor:pointer;margin-right:6px}
button.alt{background:#3a1218}
.code{font-size:1.4rem;letter-spacing:3px;color:#e3182f}
small{color:#b08a8f}
</style></head><body><main>
<h1>ScreamIQ Admin</h1>
<div class="card" id="login">
  <input id="pw" type="password" placeholder="Admin password">
  <button onclick="load()">Log in</button> <small id="msg"></small>
</div>
<div id="panel" style="display:none">
  <div class="card">
    <b>Add a code</b><br><br>
    <input id="nc" maxlength="12" placeholder="CODE (letters/numbers)">
    <input id="nl" maxlength="40" placeholder="Name shown to players, e.g. the Asylum">
    <button onclick="act('add')">Add code</button>
  </div>
  <div id="list"></div>
</div>
<script>
var pw="";
function api(a,code){
  return fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:pw,action:a,code:code,label:document.getElementById("nl").value})}).then(function(r){return r.json()});
}
function load(){
  pw=document.getElementById("pw").value;
  api("list","").then(show).catch(function(){document.getElementById("msg").textContent="Could not connect"});
}
function act(a,code){
  if(a==="remove"&&!confirm("Delete "+code+" and all its scores?"))return;
  if(a==="reset"&&!confirm("Clear all scores for "+code+"?"))return;
  api(a,code||document.getElementById("nc").value).then(show);
  if(a==="add"){document.getElementById("nc").value="";document.getElementById("nl").value=""}
}
function show(j){
  if(!j.ok){document.getElementById("msg").textContent="Wrong password";return}
  document.getElementById("login").style.display="none";
  document.getElementById("panel").style.display="block";
  var l=document.getElementById("list");l.innerHTML="";
  j.codes.forEach(function(c){
    var d=document.createElement("div");d.className="card";
    var t=document.createElement("div");t.className="code";t.textContent=c.code;d.appendChild(t);
    var s=document.createElement("small");s.textContent=c.label+" | "+c.plays+" plays";d.appendChild(s);
    c.top.forEach(function(r,i){var p=document.createElement("div");p.textContent=(i+1)+". "+r.name+" - "+r.score;d.appendChild(p)});
    var b1=document.createElement("button");b1.className="alt";b1.textContent="Clear scores";b1.onclick=function(){act("reset",c.code)};
    var b2=document.createElement("button");b2.className="alt";b2.textContent="Delete code";b2.onclick=function(){act("remove",c.code)};
    var w=document.createElement("div");w.style.marginTop="8px";w.appendChild(b1);w.appendChild(b2);d.appendChild(w);
    l.appendChild(d);
  });
}
</script></main></body></html>
