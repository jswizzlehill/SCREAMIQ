<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreamIQ Display</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at top,#3a0508 0,#060203 65%) fixed;color:#f3dede;font-family:Georgia,serif;overflow:hidden}
.drip{position:fixed;top:0;left:0;right:0;height:5vh;pointer-events:none;background:radial-gradient(ellipse .6vw 3.4vh at 2vw 0,#a00016 72%,transparent 74%) 0 0/6vw 5vh repeat-x,radial-gradient(ellipse .4vw 1.8vh at 4.6vw 0,#7a0010 72%,transparent 74%) 0 0/6vw 5vh repeat-x,linear-gradient(#8a0010,#8a0010) 0 0/100% 1vh no-repeat}
#wrap{display:grid;grid-template-columns:3fr 2fr;gap:2.5vw;height:100%;padding:7vh 3vw 3vh}
h1{margin:0 0 1vh;font-size:5vh;letter-spacing:.4vh;color:#e3182f;text-shadow:0 0 2vh #ff1f3d88}
h1 span{color:#fff}
.card{background:#140609;border:.2vh solid #5a141c;border-radius:2vh;padding:3vh 2.5vw;box-shadow:inset 0 0 4vh #000a}
#left{display:flex;flex-direction:column}
#qcard{flex:1;display:flex;flex-direction:column;justify-content:center}
#q{font-size:clamp(22px,4.4vh,60px);line-height:1.3;margin:0 0 3vh}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.5vw}
.o{background:#1f0a0d;border:.3vh solid #6e1a24;border-radius:1.6vh;padding:2vh 1.2vw;font-size:clamp(18px,3.2vh,44px);transition:all .3s}
.o b{color:#e3182f;margin-right:.8vw}
.o.good{background:#12381f;border-color:#3ddc84;color:#fff}
.o.dim{opacity:.3}
#cd{text-align:center;font-size:9vh;font-weight:bold;color:#fff;line-height:1;margin-top:2vh;text-shadow:0 0 2vh #ff1f3d}
#cd.low{color:#ff4d5e}
#bar{height:1.2vh;background:#2a0a0e;border-radius:1vh;overflow:hidden;margin-top:3vh}
#bar i{display:block;height:100%;width:100%;background:#e3182f}
#join{margin-top:2vh;text-align:center;font-size:clamp(16px,3vh,40px);color:#b08a8f}
#join b{color:#fff;letter-spacing:.6vh}
#jc{font-size:1.9em;color:#e3182f!important;text-shadow:0 0 2vh #ff1f3d88}
#right{display:flex;flex-direction:column}
#right h2{margin:0 0 1.5vh;text-align:center;font-size:3.6vh;color:#e3182f}
ol{list-style:none;margin:0;padding:0;flex:1}
li{display:flex;gap:1vw;padding:1.1vh .6vw;border-bottom:.15vh solid #3a1218;font-size:clamp(16px,3.4vh,46px)}
li .n{width:3vw;color:#b08a8f}li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li .sc{color:#e3182f;font-weight:bold}
li:first-child .nm{color:#fff;font-weight:bold}
#empty{text-align:center;color:#b08a8f;margin-top:4vh;font-size:3vh}
#setup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#060203;z-index:5;flex-direction:column}
#setup input{font:inherit;font-size:4vh;text-align:center;padding:1.5vh 2vw;border-radius:1.5vh;border:.3vh solid #6e1a24;background:#0a0305;color:#f3dede;text-transform:uppercase}
#setup button{font:inherit;font-size:3vh;margin-top:2vh;padding:1.5vh 3vw;border:0;border-radius:1.5vh;background:#e3182f;color:#fff;font-weight:bold}
@media (max-width:800px){#wrap{grid-template-columns:1fr;overflow:auto}body{overflow:auto}}
</style></head><body>
<div class="drip"></div>
<div id="setup"><h1>SCREAM<span>IQ</span> DISPLAY</h1><p>Type the code this screen should show</p>
<input id="sc" maxlength="12" placeholder="CODE"><button id="sb">Show screen</button></div>
<div id="wrap">
  <div id="left">
    <h1>SCREAM<span>IQ</span></h1>
    <div class="card" id="qcard">
      <p id="q"></p><div id="opts"></div>
      <div id="cd"></div><div id="bar"><i id="fill"></i></div>
    </div>
    <div id="join"></div>
  </div>
  <div class="card" id="right"><h2>TOP 10</h2><ol id="list"></ol><div id="empty"></div></div>
</div>
<script src="/questions.js"></script>
<script>
var LOBBY=180000,QMS=10000,REV=5000,NQ=10,RES=20000,CYCLE=LOBBY+NQ*(QMS+REV)+RES;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuf(a,seed){a=a.slice();var r=rng(seed);for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function qFor(r,i){var q=BANK[sshuf(BANK.map(function(_,k){return k}),r*7919+13)[i]];return{q:q[0],opts:sshuf(q[1].map(function(t,k){return{t:t,ok:k===0}}),r*104729+i*31+7)}}
var $=function(i){return document.getElementById(i)};
var code=(new URLSearchParams(location.search).get("code")||"").trim().toUpperCase();
var ev=(new URLSearchParams(location.search).get("event")||"").trim().toUpperCase();
if(!code&&!ev){$("setup").style.display="flex";
  $("sb").onclick=function(){var c=$("sc").value.trim();if(c)location.search="?code="+encodeURIComponent(c)};
  $("sc").onkeydown=function(e){if(e.key==="Enter")$("sb").click()};
}else{
  $("join").innerHTML='Play on your phone: <b></b> &nbsp; Code: <b id="jc"></b><div id="jn" style="font-size:.7em;margin-top:.6vh"></div>';
  $("join").querySelectorAll("b")[0].textContent=location.host;
  $("jc").textContent=code;
  var nextAt=0;
  setInterval(function(){
    if(!nextAt){return}
    var m=Math.max(0,Math.floor((nextAt-Date.now())/1000)),mm=Math.floor(m/60),ss=("0"+(m%60)).slice(-2);
    $("jn").textContent="New code in "+mm+":"+ss;
  },1000);
  var order=[],pos=0;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function nextQ(){
    if(pos>=order.length){order=shuffle(BANK);pos=0}
    var q=order[pos++];$("q").textContent=q[0];
    var o=$("opts");o.innerHTML="";
    shuffle(q[1].map(function(t,k){return{t:t,ok:k===0}})).forEach(function(x,k){
      var d=document.createElement("div");d.className="o";d.dataset.ok=x.ok?"1":"";
      var b=document.createElement("b");b.textContent="ABCD"[k];
      var s=document.createElement("span");s.textContent=x.t;d.appendChild(b);d.appendChild(s);o.appendChild(d);
    });
    var f=$("fill");f.style.transition="none";f.style.width="100%";
    setTimeout(function(){f.style.transition="width 10s linear";f.style.width="0%"},50);
    var n=10,cd=$("cd");cd.textContent=n;cd.className="";clearInterval(window.tm);
    window.tm=setInterval(function(){n--;cd.textContent=n>0?n:"";cd.className=n<=3?"low":"";if(n<=0){clearInterval(window.tm);reveal()}},1000);
  }
  function reveal(){
    $("cd").textContent="ANSWER";$("cd").className="";
    Array.prototype.forEach.call($("opts").children,function(d){d.classList.add(d.dataset.ok?"good":"dim")});
    setTimeout(nextQ,5000);
  }
  if(!ev)nextQ();else startLive();

var sync={off:0,epoch:0,opens:0,ready:false,results:false},cur=-1,curR=-1;
function heading(h){$("right").querySelector("h2").textContent=h;sync.results=(h==="ROUND RESULTS")}
function startLive(){
  setInterval(function(){
    if(!sync.ready)return;
    if(!sync.epoch){
      var iq=$("q"),ic=$("cd"),left=sync.opens?Math.max(0,Math.ceil((sync.opens-(Date.now()+sync.off))/1000)):0;
      $("opts").innerHTML="";$("fill").style.width="0%";cur=-1;heading("TONIGHT'S TOP 10");
      if(sync.opens){
        var h=Math.floor(left/3600),m=Math.floor((left%3600)/60),sc=("0"+(left%60)).slice(-2);
        ic.textContent=(h?h+":"+("0"+m).slice(-2):m)+":"+sc;ic.className="";
        iq.textContent="The game opens soon. Enter the code on your phone to wait inside!";
      }else{
        ic.textContent="";iq.textContent="Waiting for the host to start the game. Enter the code on your phone now!";
      }
      return}
    var now=Date.now()+sync.off-sync.epoch,r=Math.floor(now/CYCLE),t=now-r*CYCLE,qa=LOBBY+NQ*(QMS+REV);
    var q=$("q"),o=$("opts"),cd=$("cd"),f=$("fill");f.style.transition="none";
    if(t<LOBBY){
      cur=-1;q.textContent="Enter the code on your phone. The game starts when the countdown ends!";o.innerHTML="";
      var ls=Math.ceil((LOBBY-t)/1000);cd.textContent=Math.floor(ls/60)+":"+("0"+(ls%60)).slice(-2);cd.className="";f.style.width=((LOBBY-t)/LOBBY*100)+"%";heading("TONIGHT'S TOP 10");
    }else if(t<qa){
      var qi=Math.floor((t-LOBBY)/(QMS+REV)),w=(t-LOBBY)-qi*(QMS+REV);
      if(cur!==qi||curR!==r){
        cur=qi;curR=r;var d=qFor(r,qi);q.textContent=(qi+1)+"/10   "+d.q;o.innerHTML="";
        d.opts.forEach(function(x,k){var e=document.createElement("div");e.className="o";e.dataset.ok=x.ok?"1":"";
          var b=document.createElement("b");b.textContent="ABCD"[k];var s=document.createElement("span");s.textContent=x.t;
          e.appendChild(b);e.appendChild(s);o.appendChild(e)});
      }
      if(w<QMS){cd.textContent=Math.ceil((QMS-w)/1000);cd.className=(QMS-w)<=3000?"low":"";f.style.width=((QMS-w)/QMS*100)+"%"}
      else{cd.textContent="ANSWER";cd.className="";f.style.width="0%";
        Array.prototype.forEach.call(o.children,function(e){e.classList.add(e.dataset.ok?"good":"dim")})}
      heading("TONIGHT'S TOP 10");
    }else{
      cur=-1;q.textContent="Round over! Final scores are in.";o.innerHTML="";
      cd.textContent=Math.ceil((CYCLE-t)/1000);cd.className="";f.style.width=((CYCLE-t)/RES*100)+"%";heading("ROUND RESULTS");
    }
  },250);
}
  function board(){
    var t0=Date.now(),arm=ev&&!sync.armed;sync.armed=true;
    fetch(ev?"/api/display?event="+encodeURIComponent(ev)+(arm?"&arm=1":""):"/api/board?code="+encodeURIComponent(code)).then(function(r){return r.json()}).then(function(j){
      if(ev){sync.epoch=j.epoch||0;sync.opens=j.opensAt||0;sync.ready=true;sync.off=(j.now||Date.now())+(Date.now()-t0)/2-Date.now();$("jc").textContent=j.code||"- - - - -";nextAt=0;$("jn").textContent="Join any time and play along";if(sync.results)j.rows=j.roundRows}
      var l=$("list");l.innerHTML="";
      (j.rows||[]).forEach(function(r,i){
        var li=document.createElement("li");
        var a=document.createElement("span");a.className="n";a.textContent=(i+1)+".";
        var b=document.createElement("span");b.className="nm";b.textContent=r.name;
        var c=document.createElement("span");c.className="sc";c.textContent=r.score;
        li.appendChild(a);li.appendChild(b);li.appendChild(c);l.appendChild(li);
      });
      $("empty").textContent=(j.rows&&j.rows.length)?"":"No scores yet. Be the first!";
    }).catch(function(){});
  }
  board();setInterval(board,ev?3000:5000);
}
</script></body></html>
